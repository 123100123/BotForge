# Render Blueprint for BotForge: the backend (Docker web service) and the web app (Node web service).
# The database is Supabase, so there is no database resource here. The web app can also run on Vercel
# (README, Deployment checklist, step 4); then drop the botforge-web service below.
#
# The API must stay single-instance: agent runs, rate limits and the Telegram webhook handler live in
# one process. Never set numInstances above 1. The current test deployment uses the free plan (owner's
# decision, 2026-10-07): it sleeps after idle, so the first Telegram update waits for a cold start and
# in-flight agent runs are lost when it spins down. Switch to "starter" (paid, always-on) for the demo.
#
# Free plan caveats for the Business OS (2026-10-08): the local disk is ephemeral, so uploaded
# spreadsheets (UPLOAD_DIR) are lost on every redeploy or restart, while analysis results stored in
# Postgres survive; and a sleeping instance runs no notification ticker, so reminders, announcements
# and scheduled reports go out late (when the next request wakes it). Use "starter" for the demo.
#
# Migrations: backend/Dockerfile runs `alembic upgrade head` before serving, so the next deploy of this
# branch applies 0003-0005 to the hosted Supabase database. 0003 adopts every existing Supabase owner
# id as a placeholder user (same UUID, no password) so existing bots keep their owner; 0004 adds the
# polling offset; 0005 the Business OS tables. Take a Supabase backup before that first deploy.
# With AUTH_PROVIDER=supabase (below) an owner's next sign-in carries that same Supabase user id, so
# they see their bots again, and the placeholder account takes the email from their token.
#
# Sign-in on Render: AUTH_PROVIDER=supabase (API) and NEXT_PUBLIC_AUTH_PROVIDER=supabase (web app).
# The web app and the API are two *.onrender.com services, two different sites, so the own login's
# SameSite=Lax session cookie cannot work between them. Instead the web app signs in with Supabase
# Auth and sends the access token as "Authorization: Bearer" with no cookies; the API verifies it
# (SUPABASE_* below), ignores cookies, needs no CSRF header, and answers 404 on its own /auth/login,
# /auth/signup and /auth/logout. The self-hosted stack in deploy/ keeps AUTH_PROVIDER=local.
# Who may sign up is set in the Supabase dashboard in this mode (its Authentication settings: whether new
# users may sign up, and whether they must confirm their email); AUTH_ALLOW_SIGNUP applies only to the
# own login. Set the project's Site URL to the web app's URL, where email confirmation links land.
#
# Self-hosting alternative: deploy/ (Docker Compose + Caddy, README "Self-hosting on a VPS").
#
# Every variable is declared here; `sync: false` ones are asked for in the Render dashboard when the
# Blueprint is applied and are never stored in git.
services:
  - type: web
    name: botforge-api
    runtime: docker
    rootDir: backend           # uses backend/Dockerfile with backend/ as the build context
    plan: free                 # test deployment; "starter" (paid, always-on) for the demo, see above
    numInstances: 1
    healthCheckPath: /healthz
    autoDeploy: false          # deploy deliberately from the dashboard
    envVars:
      # --- database (Supabase Postgres) ---
      # Supabase "Connect" -> Session pooler string (port 5432) with ?ssl=require appended:
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?ssl=require
      # Not the transaction pooler (port 6543): asyncpg's prepared statements break there.
      # sslmode=require also works (translated to ssl=require by app.config.to_async_url).
      - key: DATABASE_URL
        sync: false
      # --- authentication (Supabase Auth; see the top of this file) ---
      - key: AUTH_PROVIDER           # supabase: bearer tokens from Supabase Auth; the web app must say the same
        value: "supabase"
      # Read with AUTH_PROVIDER=supabase. Set SUPABASE_URL, plus SUPABASE_JWKS_URL (projects with the new
      # asymmetric signing keys) or SUPABASE_JWT_SECRET (legacy HS256). With neither, the API logs an
      # error at startup and refuses every login (401 without a token, 503 with one).
      - key: SUPABASE_URL            # https://<project-ref>.supabase.co ; also pins the token issuer
        sync: false
      - key: SUPABASE_JWKS_URL       # <SUPABASE_URL>/auth/v1/.well-known/jwks.json (asymmetric keys)
        sync: false
      - key: SUPABASE_JWT_SECRET     # legacy HS256 projects only; ignored when SUPABASE_JWKS_URL is set
        sync: false
      # --- secrets ---
      - key: TOKEN_ENC_KEY           # python -m app.security.crypto generate-key ; losing it orphans stored bot tokens
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- public addresses ---
      - key: PUBLIC_BASE_URL         # this service's public https URL; Telegram webhooks are registered under it
        sync: false
      - key: FRONTEND_ORIGIN         # web app origin(s) for CORS, comma-separated, no path (README step 5)
        sync: false
      - key: FRONTEND_ORIGIN_REGEX   # optional, leave empty unless deploy previews must reach this API (README step 5)
        sync: false
      # --- LLM ---
      # Keep Anthropic as the deployed default. Liara and Top Tools require their own server-only
      # credentials; claude_cli is intended for local development.
      - key: LLM_PROVIDER
        value: "anthropic"
      - key: LLM_MODEL_STRONG
        sync: false
      - key: LLM_MODEL_FAST
        sync: false
      - key: LIARA_API_KEY             # secret project-scoped AI key, never an account API key
        sync: false
      - key: LIARA_BASE_URL            # https://ai.liara.ir/api/v1/<project-id>
        sync: false
      - key: LIARA_MODEL_STRONG
        value: "google/gemini-3.8-flash"
      - key: LIARA_MODEL_FAST
        value: "deepseek/deepseek-v4-flash"
      - key: LIARA_MAX_TOKENS
        value: "32000"
      - key: LIARA_TIMEOUT_SECONDS
        value: "180"
      - key: LIARA_MAX_RETRIES
        value: "2"
      - key: LIARA_TOKEN_PRICES_JSON   # optional model price map; leave blank when unpriced
        sync: false
      - key: TOP_TOOLS_API_KEY          # secret Top Tools API key
        sync: false
      - key: TOP_TOOLS_BASE_URL         # documented endpoint; https://top-tools-ai.com/v1 also supported
        value: "https://top-tools-ai.com/api/v1"
      - key: TOP_TOOLS_MODEL_STRONG     # required confirmed model ID; no unverified default
        sync: false
      - key: TOP_TOOLS_MODEL_FAST       # required confirmed model ID; no unverified default
        sync: false
      - key: TOP_TOOLS_MAX_TOKENS
        value: "32000"
      - key: TOP_TOOLS_TIMEOUT_SECONDS
        value: "180"
      - key: TOP_TOOLS_MAX_RETRIES
        value: "2"
      - key: TOP_TOOLS_TOKEN_PRICES_JSON # optional model price map; leave blank when unpriced
        sync: false
      - key: LOG_LLM_BODIES          # keep false in production: bodies contain owner chat text
        value: "false"
      # --- agent limits (defaults shown; lower AGENT_DAILY_RUN_CAP before a public demo) ---
      - key: AGENT_DAILY_RUN_CAP
        value: "30"
      - key: AGENT_RUNS_PER_MINUTE
        value: "5"
      - key: AGENT_INPUT_TOKEN_BUDGET
        value: "600000"
      - key: AGENT_OUTPUT_TOKEN_BUDGET
        value: "150000"
      - key: AGENT_MAX_TOOL_CALLS
        value: "15"
      - key: AGENT_MAX_REPAIR_ROUNDS
        value: "2"
      - key: AGENT_MAX_QUESTIONS
        value: "3"
      - key: AGENT_MAX_CLARIFY_ROUNDS
        value: "2"
      # --- Telegram ---
      - key: TELEGRAM_MODE           # webhook: Telegram posts to PUBLIC_BASE_URL/tg/<bot id> (polling is for hosts Telegram cannot reach)
        value: "webhook"
      # --- Business OS ---
      - key: NOTIFICATIONS_TICKER    # sends queued reminders, announcements and scheduled reports; exactly one process (numInstances 1)
        value: "true"
      - key: UPLOAD_DIR              # spreadsheet uploads; created in the image. Ephemeral on Render (see the top of this file)
        value: "/data/uploads"
      - key: UPLOAD_MAX_BYTES        # 5 MB per uploaded file
        value: "5242880"
      - key: SPREADSHEET_MAX_ROWS
        value: "50000"
      - key: SPREADSHEET_MAX_COLUMNS
        value: "100"
      - key: COPILOT_DAILY_CAP       # Manager Copilot questions per owner account per rolling 24 hours (cost control)
        value: "50"

  # The web app (Next.js). All values are public and inlined at build time, so a change needs a new build.
  # It signs in with Supabase Auth (NEXT_PUBLIC_AUTH_PROVIDER=supabase) and calls the API on its own
  # *.onrender.com origin with the access token in "Authorization: Bearer" and no cookies, so a
  # cross-origin NEXT_PUBLIC_API_BASE_URL works; the API's FRONTEND_ORIGIN must list this service's URL
  # (CORS). Without the two Supabase values the web app shows a configuration error page instead.
  - type: web
    name: botforge-web
    runtime: node
    rootDir: frontend
    plan: free                 # the web app holds no state; sleeping only delays the first page load
    buildCommand: npm ci && npm run build
    startCommand: npm start    # next start listens on Render's PORT
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_MOCK
        value: "0"
      - key: NEXT_PUBLIC_API_BASE_URL    # the botforge-api public URL, no trailing slash
        sync: false
      - key: NEXT_PUBLIC_AUTH_PROVIDER   # the API's AUTH_PROVIDER
        value: "supabase"
      - key: NEXT_PUBLIC_SUPABASE_URL    # https://<project-ref>.supabase.co (the API's SUPABASE_URL)
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY   # anon/publishable key (public); never the service-role key
        sync: false
