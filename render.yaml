# Render Blueprint for BotForge: the backend (Docker web service) and the web app (Node web service).
# The database is Supabase, so there is no database resource here. The web app can also run on Vercel
# (README, Deployment checklist, step 4); then drop the botforge-web service below.
#
# The service must stay always-on and single-instance: agent runs, rate limits and the Telegram
# webhook handler live in one process. Use a paid plan that does not sleep (a free instance spins
# down and drops in-flight agent runs). Never set numInstances above 1.
#
# Every variable is declared here; `sync: false` ones are asked for in the Render dashboard when the
# Blueprint is applied and are never stored in git.
services:
  - type: web
    name: botforge-api
    runtime: docker
    rootDir: backend           # uses backend/Dockerfile with backend/ as the build context
    plan: starter              # paid, always-on (a free instance works for testing; see the note above)
    numInstances: 1
    healthCheckPath: /healthz
    autoDeploy: false          # deploy deliberately from the dashboard
    envVars:
      # --- database (Supabase Postgres) ---
      # Supabase "Connect" -> Session pooler string (port 5432) with ?ssl=require appended:
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?ssl=require
      # Not the transaction pooler (port 6543): asyncpg's prepared statements break there.
      # sslmode=require also works (translated to ssl=require by app.config.to_async_url).
      - key: DATABASE_URL
        sync: false
      # --- authentication (Supabase Auth) ---
      - key: SUPABASE_URL            # https://<project-ref>.supabase.co ; also pins the token issuer
        sync: false
      - key: SUPABASE_JWKS_URL       # <SUPABASE_URL>/auth/v1/.well-known/jwks.json (asymmetric keys)
        sync: false
      - key: SUPABASE_JWT_SECRET     # legacy HS256 projects only; ignored when SUPABASE_JWKS_URL is set
        sync: false
      # --- secrets ---
      - key: TOKEN_ENC_KEY           # python -m app.security.crypto generate-key ; losing it orphans stored bot tokens
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- public addresses ---
      - key: PUBLIC_BASE_URL         # this service's public https URL; Telegram webhooks are registered under it
        sync: false
      - key: FRONTEND_ORIGIN         # web app origin(s) for CORS, comma-separated, no path (README step 5)
        sync: false
      - key: FRONTEND_ORIGIN_REGEX   # optional, leave empty unless deploy previews must reach this API (README step 5)
        sync: false
      # --- LLM ---
      - key: LLM_MODEL_STRONG
        sync: false
      - key: LLM_MODEL_FAST
        sync: false
      - key: LOG_LLM_BODIES          # keep false in production: bodies contain owner chat text
        value: "false"
      # --- agent limits (defaults shown; lower AGENT_DAILY_RUN_CAP before a public demo) ---
      - key: AGENT_DAILY_RUN_CAP
        value: "30"
      - key: AGENT_RUNS_PER_MINUTE
        value: "5"
      - key: AGENT_INPUT_TOKEN_BUDGET
        value: "600000"
      - key: AGENT_OUTPUT_TOKEN_BUDGET
        value: "150000"
      - key: AGENT_MAX_TOOL_CALLS
        value: "15"
      - key: AGENT_MAX_REPAIR_ROUNDS
        value: "2"
      - key: AGENT_MAX_QUESTIONS
        value: "3"
      - key: AGENT_MAX_CLARIFY_ROUNDS
        value: "2"

  # The web app (Next.js). All values are public and inlined at build time, so a change needs a new build.
  - type: web
    name: botforge-web
    runtime: node
    rootDir: frontend
    plan: free                 # the web app holds no state; sleeping only delays the first page load
    buildCommand: npm ci && npm run build
    startCommand: npm start    # next start listens on Render's PORT
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_MOCK
        value: "0"
      - key: NEXT_PUBLIC_API_BASE_URL    # the botforge-api public URL, no trailing slash
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL    # https://<project-ref>.supabase.co
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY   # anon/publishable key (public); never the service-role key
        sync: false
