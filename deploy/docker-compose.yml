# BotForge on one VPS: Postgres + backend + frontend behind Caddy (automatic HTTPS).
# Run every command from this directory (deploy/). Settings come from deploy/.env (copy .env.example).
#
# Only Caddy publishes ports (80, 443). The database, backend and frontend are reachable only on the
# internal network, so a wrong firewall rule cannot expose them.
#
# The backend stays ONE container with ONE uvicorn worker: agent runs, rate limits, the notification
# ticker and the Telegram webhook handler (or, with TELEGRAM_MODE=polling, the Telegram poller) live in
# that process. Never add `deploy.replicas` or `--scale backend=2`: two pollers for one bot make Telegram
# refuse both (409), and uploads live on a volume only this container mounts.

name: botforge

# Build-time network settings shared by both image builds. Optional and empty by default: a proxy for
# the downloads (http_proxy / https_proxy / no_proxy are predefined build args in Docker).
x-build-proxy: &build_proxy
  http_proxy: ${BUILD_PROXY:-}
  https_proxy: ${BUILD_PROXY:-}
  no_proxy: localhost,127.0.0.1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [internal]

  backend:
    build:
      context: ../backend
      args:
        <<: *build_proxy
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        UV_EXTRA_GROUPS: ${UV_EXTRA_GROUPS:-}
      extra_hosts:
        - "host.docker.internal:host-gateway" # lets a proxy running on the host be reached
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The hostname is configured once (SITE_HOST); the browser talks to the site origin only.
      FRONTEND_ORIGIN: https://${SITE_HOST:?set SITE_HOST in deploy/.env}
      PUBLIC_BASE_URL: https://${SITE_HOST}
      # "webhook": Telegram posts updates to https://SITE_HOST/tg/<bot id> (it must reach this server).
      # "polling": the backend fetches them with getUpdates, outbound only (see deploy/.env.example).
      TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
      # Own login: email + password, server-side sessions in the HttpOnly bf_session cookie. This stack
      # serves the web app and the API on one origin, which that cookie needs, so keep "local" (and the
      # frontend's NEXT_PUBLIC_AUTH_PROVIDER below with it). "supabase" is the hosted Render deployment.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOW_SIGNUP: ${AUTH_ALLOW_SIGNUP:-true}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-168}
      AUTH_SESSION_MAX_AGE_DAYS: ${AUTH_SESSION_MAX_AGE_DAYS:-30}
      # The rate limiter keys on the client IP. Uvicorn takes it from X-Forwarded-For only for
      # connections from these addresses (read from this variable; the Dockerfile CMD passes no
      # --forwarded-allow-ips). It is Caddy's fixed address on the network below, never "*": the
      # backend port is unpublished, so nothing but Caddy can reach it, and Caddy overwrites the header.
      FORWARDED_ALLOW_IPS: ${CADDY_IP:-10.250.77.10}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:?set TOKEN_ENC_KEY in deploy/.env}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The SDK reads this variable when no base_url is passed, and an empty value would break it,
      # so the default is the SDK's own default. Set it only for an Anthropic-compatible mirror.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      LLM_MODEL_STRONG: ${LLM_MODEL_STRONG:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-}
      LOG_LLM_BODIES: ${LOG_LLM_BODIES:-false}
      # The API docs and schema are public when on: keep false on the server (local development only).
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      AGENT_DAILY_RUN_CAP: ${AGENT_DAILY_RUN_CAP:-30}
      AGENT_RUNS_PER_MINUTE: ${AGENT_RUNS_PER_MINUTE:-5}
      COPILOT_DAILY_CAP: ${COPILOT_DAILY_CAP:-50}
      # Notification ticker (reminders, announcements, scheduled reports). It runs inside this single
      # backend process, which is one more reason never to run a second backend replica.
      NOTIFICATIONS_TICKER: ${NOTIFICATIONS_TICKER:-true}
      NOTIFICATIONS_TICK_SECONDS: ${NOTIFICATIONS_TICK_SECONDS:-20}
      NOTIFICATIONS_SEND_RATE_PER_SECOND: ${NOTIFICATIONS_SEND_RATE_PER_SECOND:-15}
      # Spreadsheet uploads live on the `uploads` volume below (fixed path: it must match the mount).
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      SPREADSHEET_MAX_ROWS: ${SPREADSHEET_MAX_ROWS:-50000}
      SPREADSHEET_MAX_COLUMNS: ${SPREADSHEET_MAX_COLUMNS:-100}
      # Optional outbound proxy (Telegram, the LLM API). The internal names always bypass it.
      HTTP_PROXY: ${OUTBOUND_HTTP_PROXY:-}
      HTTPS_PROXY: ${OUTBOUND_HTTPS_PROXY:-}
      NO_PROXY: db,backend,frontend,localhost,127.0.0.1${OUTBOUND_NO_PROXY:+,${OUTBOUND_NO_PROXY}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The golden spec for scripts/load_spec.py (the image holds only app/, alembic/ and scripts/).
      - ../examples:/examples:ro
      # Uploaded spreadsheets (UPLOAD_DIR). Keep this volume: analysis runs point at these files.
      - uploads:/data/uploads
    networks: [internal]

  # One-shot: a new named volume is owned by root, but the backend runs as uid 10001 (backend/Dockerfile,
  # user "botforge"), so hand the uploads volume to that user before the backend starts. Idempotent.
  # Reuses the Postgres image, which is pulled anyway (no extra download on restricted networks).
  uploads-init:
    image: postgres:16-alpine
    entrypoint: ["chown", "10001:10001", "/data/uploads"]
    user: "0"
    restart: "no"
    network_mode: none
    volumes:
      - uploads:/data/uploads

  frontend:
    build:
      context: ../frontend
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        <<: *build_proxy
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
        # Inlined into the JavaScript at build time: changing one needs `docker compose up -d --build`.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_MOCK: ${NEXT_PUBLIC_MOCK:-}
        # Must name the backend's AUTH_PROVIDER above: the own login.
        NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-local}
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      SITE_HOST: ${SITE_HOST}
      # Written into the Caddyfile only when ACME_EMAIL is set (see the global block there).
      ACME_EMAIL_LINE: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      # Optional outbound proxy: Caddy may need it to reach Let's Encrypt / ZeroSSL (ACME).
      HTTP_PROXY: ${OUTBOUND_HTTP_PROXY:-}
      HTTPS_PROXY: ${OUTBOUND_HTTPS_PROXY:-}
      NO_PROXY: db,backend,frontend,localhost,127.0.0.1${OUTBOUND_NO_PROXY:+,${OUTBOUND_NO_PROXY}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and the ACME account: keep this volume
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: ${CADDY_IP:-10.250.77.10}

# A fixed subnet, so Caddy has a fixed address that the backend can trust (FORWARDED_ALLOW_IPS).
# If it collides with a network on your server, set CADDY_SUBNET and CADDY_IP in deploy/.env (an address
# inside that subnet, not its first address).
networks:
  internal:
    ipam:
      config:
        - subnet: ${CADDY_SUBNET:-10.250.77.0/24}

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
