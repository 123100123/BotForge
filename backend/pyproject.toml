[project]
name = "app"
version = "0.1.0"
description = "BotForge backend: agent, BotSpec contracts, deterministic bot runtime"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "tzdata>=2024.1",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "cryptography>=44.0.1",
    # app/security/supabase_auth.py (AUTH_PROVIDER=supabase): Supabase access-token verification.
    # 2.10.1 or newer: 2.10.0 accepted an issuer that is only a substring of the expected one.
    "pyjwt[crypto]>=2.10.1",
    "anthropic>=1.11.0",
    "argon2-cffi>=23.1.0",
    # app/integrations/telegram/client.py. The [socks] extras are needed when ALL_PROXY=socks5h://...
    # is set; without socksio the client cannot even be built.
    "httpx[socks]>=0.28",
    # anthropic uses httpx2, which has its own socks extra (anthropic itself offers none).
    "httpx2[socks]",
    # app/spreadsheets/: reads uploaded .xlsx files (read-only mode). CSV uses the standard library.
    "openpyxl>=3.1",
]

[dependency-groups]
dbtest = [
    "pgserver>=0.1.4",
]
# Optional: ``ClaudeCodeLLM`` (LLM_PROVIDER=claude_cli) runs the model through the local Claude Code
# login for development and live evals. Not a runtime dependency: the app and image work without it.
headless = [
    "claude-agent-sdk>=0.2.163",  # option names and stream shapes verified against 0.2.163
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Persian text is everywhere; the "ambiguous unicode" rules would flag every string.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]  # RUF012: pydantic field defaults are copied

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
