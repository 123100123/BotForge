[project]
name = "app"
version = "0.1.0"
description = "BotForge backend: agent, BotSpec contracts, deterministic bot runtime"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "tzdata>=2024.1",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "cryptography>=44.0.1",
    "anthropic>=1.11.0",
    "argon2-cffi>=23.1.0",
    "httpx",  # app/integrations/telegram/client.py; anthropic no longer pulls it in (it uses httpx2)
]

[dependency-groups]
dbtest = [
    "pgserver>=0.1.4",
]
# Optional: ``ClaudeCodeLLM`` (LLM_PROVIDER=claude_cli) runs the model through the local Claude Code
# login for development and live evals. Not a runtime dependency: the app and image work without it.
headless = [
    "claude-agent-sdk>=0.2.163",  # option names and stream shapes verified against 0.2.163
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Persian text is everywhere; the "ambiguous unicode" rules would flag every string.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]  # RUF012: pydantic field defaults are copied

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
